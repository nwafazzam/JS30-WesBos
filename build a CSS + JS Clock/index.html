<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JS + CSS Clock</title>
    <link rel="icon" href="https://fav.farm/🔥" />
    <!-- css styles link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div class="clock">
        <div class="clock-face">
            <div class="hand hour-hand"></div>
            <div class="hand min-hand"></div>
            <div class="hand second-hand"></div>
        </div>
    </div>



    <script>

        const secondHand = document.querySelector('.second-hand');
        const minuteHand = document.querySelector('.min-hand');
        const hoursHand = document.querySelector('.hour-hand');

        function setDate() {
            const now = new Date();

            const seconds = now.getSeconds();
            const secDeg = ((seconds / 60) * 360) + 90;
            secondHand.style.transition = seconds === 0 ? 'none' : 'all 0.05s cubic-bezier(0.1, 2.7, 0.58, 1)';
            secondHand.style.transform = ` rotate(${secDeg}deg) `;

            const minutes = now.getMinutes();
            const minDeg = ((minutes / 60) * 360) + 90;
            minuteHand.style.transition = minutes === 0 ? 'none' : 'all 0.05s cubic-bezier(0.1, 2.7, 0.58, 1)';
            minuteHand.style.transform = ` rotate(${minDeg}deg) `;

            const hours = now.getHours();
            const hourDeg = ((hours / 12) * 360) + 90;
            hoursHand.style.transition = hours === 0 ? 'none' : 'all 0.05s cubic-bezier(0.1, 2.7, 0.58, 1)';
            hoursHand.style.transform = ` rotate(${hourDeg}deg) `;

            console.log(seconds);
        };

        setInterval(setDate, 1000);
        setDate();
    </script>

</body>



</html>
